name: Build EXE with Nuitka

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install nuitka pyautogui

      - name: Build EXE with Nuitka
        run: |
          nuitka --standalone --onefile --windows-console-mode=disable --enable-plugin=pyqt5 --include-data-dir=./resources=./resources --output-dir=dist your_script.py

      - name: Upload EXE as artifact
        uses: actions/upload-artifact@v4
        with:
          name: your_program_exe
          path: dist/*.exe
